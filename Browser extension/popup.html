<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Export rozvrhu</title>
    <style>
      body {
        width: 290px;
        margin: 0;
        padding: 18px;
        color: #e8edf5;
        background: #0d1522;
        font: 13px "Segoe UI", Arial, sans-serif;
      }
      h1 { margin: 0 0 9px; font-size: 17px; }
      p { color: #aab7c8; line-height: 1.5; }
      button {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #3285c7;
        color: white;
        font-weight: 650;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 18px; color: #aab7c8; }
      #status.error { color: #ff9b9b; }
      #status.success { color: #72d7b5; }
    </style>
  </head>
  <body>
    <h1>Export rozvrhu</h1>
    <p>Otevři seznam předmětů v IS MU a stáhni export pro statickou GitHub Pages verzi kalendáře.</p>
    <button id="export" type="button">Načíst a stáhnout JSON</button>
    <div id="status" role="status">Data se stáhnou do souboru. Rozšíření je samo nikam neodesílá.</div>
    <script src="popup.js"></script>
  </body>
</html>
